name: CD

on:
  push:
    branches: ["main"]
  release:
    types: [published]

jobs:
  # Build Docker images to verify they compile correctly on every push
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build training image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.train
          platforms: linux/amd64,linux/arm64
          push: false
          tags: movie-recommender/train:latest
      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.serve
          platforms: linux/amd64,linux/arm64
          push: false
          tags: movie-recommender/serve:latest

  # On release: push images to GitHub Container Registry and deploy
  push-and-deploy:
    needs: docker-build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.serve
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/serve:${{ github.ref_name }}
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}/serve:${{ github.ref_name }}
            docker stop movie-recommender-serve || true
            docker rm movie-recommender-serve || true
            docker run -d --name movie-recommender-serve -p 8000:8000 \
              ghcr.io/${{ github.repository }}/serve:${{ github.ref_name }}
